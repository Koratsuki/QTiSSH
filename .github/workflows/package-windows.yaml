name: Package (Windows)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      QT_VERSION: 6.7.2
      QT_MODULES: qtcharts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Install OpenSSL via vcpkg
        shell: cmd
        run: |
          vcpkg install openssl:x64-windows

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep 'project(QTiSSH VERSION' src/CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "PKG=QTiSSH-v${VERSION}-x86_64" >> $GITHUB_OUTPUT

      - name: Configure
        shell: cmd
        run: |
          cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%Qt6_DIR%" -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build

      # The bare .exe is not runnable on a clean machine: it needs the Qt6
      # runtime (Core/Gui/Widgets/Network/Charts/DBus), the qwindows platform
      # plugin, the MSVC redistributables and the OpenSSL DLLs from vcpkg.
      # Collect all of them next to the binary and ship that folder as a zip.
      - name: Assemble portable bundle
        shell: pwsh
        run: |
          $pkg  = '${{ steps.version.outputs.PKG }}'
          $stage = Join-Path 'dist' $pkg
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $stageFull = (Resolve-Path $stage).Path

          Copy-Item 'build\QTiSSH.exe' (Join-Path $stage "$pkg.exe")

          # windeployqt resolves the Qt6 DLLs from the exe's import table and
          # also copies the platform plugin and (with --compiler-runtime) the
          # MSVC redistributable DLLs.
          windeployqt --release --compiler-runtime --no-translations `
            (Join-Path $stage "$pkg.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          # OpenSSL comes from vcpkg and is not known to windeployqt.
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" $stage -Force

          # windeployqt ships vc_redist.x64.exe but not the CRT itself, so copy
          # the MSVC runtime DLLs to make the folder runnable as-is.
          # Several sources are tried because their layout varies per image;
          # the verification step is what actually enforces the requirement.
          $crtCandidates = @()
          if ($env:VCToolsRedistDir) { $crtCandidates += $env:VCToolsRedistDir }
          if ($env:VCINSTALLDIR) { $crtCandidates += (Join-Path $env:VCINSTALLDIR 'Redist\MSVC') }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (${env:ProgramFiles(x86)} -and (Test-Path $vswhere)) {
            $vcDir = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vcDir) { $crtCandidates += (Join-Path $vcDir 'VC\Redist\MSVC') }
          }

          $crtCopied = 0
          foreach ($root in $crtCandidates) {
            if (-not (Test-Path $root)) { continue }
            $versions = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
                        Sort-Object -Descending -Property @{ Expression = { try { [version]$_.Name } catch { [version]'0.0' } } }
            foreach ($vdir in $versions) {
              $crtDlls = Get-ChildItem (Join-Path $vdir.FullName 'x64') -Recurse -Directory -ErrorAction SilentlyContinue |
                         Where-Object { $_.Name -like 'Microsoft.VC*.CRT' } |
                         ForEach-Object { Get-ChildItem $_.FullName -Filter '*.dll' -ErrorAction SilentlyContinue } |
                         Where-Object { $_.Name -ne 'mscp140.dll' }
              if ($crtDlls) {
                Copy-Item $crtDlls $stage -Force
                $crtCopied = @($crtDlls).Count
                Write-Host "Bundled $crtCopied MSVC runtime DLLs from $($vdir.FullName)"
                break
              }
            }
            if ($crtCopied) { break }
          }
          if (-not $crtCopied) {
            Write-Warning "No MSVC runtime DLLs found (searched: $($crtCandidates -join ', '))"
          }

          Get-ChildItem $stageFull -Recurse -File | ForEach-Object {
            "{0,-38} {1,10:N0} bytes" -f $_.FullName.Substring($stageFull.Length + 1), $_.Length
          }

      - name: Verify bundle has no missing dependencies
        shell: pwsh
        run: |
          $pkg   = '${{ steps.version.outputs.PKG }}'
          $stage = Join-Path 'dist' $pkg
          $binaries = Get-ChildItem $stage -Recurse -File |
                      Where-Object { $_.Extension -in '.exe', '.dll' }

          if (-not (Test-Path (Join-Path $stage 'platforms\qwindows.dll'))) {
            throw 'Missing Qt platform plugin: platforms\qwindows.dll'
          }

          $bundled = @{}
          foreach ($b in $binaries) { $bundled[$b.Name.ToLower()] = $true }

          $systemDirs = @("$env:SystemRoot\System32", "$env:SystemRoot\SysWOW64")
          $missing = [System.Collections.Generic.SortedSet[string]]::new()

          # The MSVC runtime must be inside the bundle, not merely installed on
          # the build agent, so check it explicitly instead of via System32.
          $crtRequired = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'concrt140.dll')
          foreach ($c in $crtRequired) {
            if (-not (Test-Path (Join-Path $stage $c))) { [void]$missing.Add("$c  (MSVC runtime)") }
          }

          foreach ($b in $binaries) {
            $deps = & dumpbin /dependents $b.FullName 2>$null
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $($b.FullName)" }
            foreach ($line in $deps) {
              $name = $line.Trim()
              if ($name -notmatch '^[A-Za-z0-9_.\-+]+\.dll$') { continue }
              # API sets are resolved by the loader, they are not real files.
              if ($name -match '^(api-ms-win|ext-ms-win)') { continue }
              if ($bundled.ContainsKey($name.ToLower())) { continue }
              if ($systemDirs | Where-Object { Test-Path (Join-Path $_ $name) }) { continue }
              [void]$missing.Add("$name  (required by $($b.Name))")
            }
          }

          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "  MISSING: $_" }
            throw "$($missing.Count) unresolved runtime dependencies in the bundle"
          }

          $crt = $crtRequired | Where-Object { Test-Path (Join-Path $stage $_) }
          Write-Host "All runtime dependencies are bundled."
          Write-Host "MSVC runtime included: $($crt -join ', ')"
          Write-Host "Bundle contents: $((Get-ChildItem $stage -Recurse -File).Count) files"

      - name: Create zip archive
        shell: pwsh
        run: |
          $pkg = '${{ steps.version.outputs.PKG }}'
          Compress-Archive -Path (Join-Path 'dist' $pkg) `
                           -DestinationPath "$pkg.zip" -CompressionLevel Optimal
          Get-ChildItem '*.zip' | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtissh-windows
          path: "*.zip"
          if-no-files-found: error

      # A re-run of the same tag would otherwise pile up outdated zips on the
      # release page, so drop the ones this workflow produced previously.
      - name: Remove stale Windows release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $env:GITHUB_REF_NAME does not exist yet, nothing to clean."
            exit 0
          }
          $assets = ($json | ConvertFrom-Json).assets |
                    Where-Object { $_.name -like 'QTiSSH-v*-x86_64.zip' }
          foreach ($a in $assets) {
            Write-Host "Removing stale release asset: $($a.name)"
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($a.id)"
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete asset $($a.name)" }
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          fail_on_unmatched_files: true
