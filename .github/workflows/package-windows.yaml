name: Package (Windows)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      QT_VERSION: 6.7.2
      QT_MODULES: qtcharts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Install OpenSSL
        run: choco install openssl -y

      - name: Find OpenSSL path
        id: openssl
        shell: bash
        run: |
          for dir in "/c/Program Files/OpenSSL-Win64" "/c/Program Files/OpenSSL"; do
            if [ -d "$dir" ]; then
              echo "OPENSSL_ROOT_DIR=$dir" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "ERROR: OpenSSL not found"
          exit 1

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep 'project(QTiSSH VERSION' src/CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
            echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Configure
        run: |
          cmake -S src -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DOPENSSL_ROOT_DIR="${{ steps.openssl.outputs.OPENSSL_ROOT_DIR }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Rename binary
        shell: bash
        run: |
          cp build/Release/QTiSSH.exe "QTiSSH-v${{ steps.version.outputs.VERSION }}-x86_64.exe"

      - name: Show packages
        run: Get-ChildItem -Filter *.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtissh-windows
          path: "*.exe"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.exe"
