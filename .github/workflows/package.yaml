name: Package (DEB/RPM)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    name: Build DEB and RPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build against the runner's own Qt rather than a downloaded one. Qt
      # records the symbol version of the headers it compiles against into the
      # executable (Qt_6.7 when building against 6.7.2). Linking against a
      # newer Qt than the target system ships produces a package that installs
      # fine and then fails to start with
      #   "version `Qt_6.7' not found (required by qtissh)".
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-charts-dev \
            libgl1-mesa-dev \
            libssl-dev \
            libx11-dev \
            ninja-build \
            rpm \
            file

      - name: Configure
        run: |
          cmake -S src -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Verify Qt symbol requirements
        run: |
          set -eu
          # The binary's required Qt symbol version must match the Qt it was
          # built against, otherwise the package would ship a binary the target
          # distro cannot start. Fail loudly here instead of at user install.
          required=$(objdump -p build/QTiSSH \
            | sed -n '/Version References/,/^$/p' \
            | grep -oE 'Qt_6\.[0-9]+' | sort -V -u | tail -1 || true)
          built=$(pkg-config --modversion Qt6Core)
          echo "Binary requires : ${required:-<none>}"
          echo "Built against   : Qt ${built}"
          if [ -n "$required" ]; then
            required_minor=${required#Qt_6.}
            built_minor=$(printf '%s' "$built" | cut -d. -f2)
            if [ "$required_minor" -gt "$built_minor" ]; then
              echo "::error::binary requires ${required} but was linked against Qt ${built}"
              exit 1
            fi
          fi
          echo "Qt symbol requirements are consistent."

      - name: Package DEB
        run: cpack --config build/CPackConfig.cmake -G DEB -B dist

      - name: Package RPM
        run: cpack --config build/CPackConfig.cmake -G RPM -B dist

      - name: Show packages
        run: ls -lh dist/

      - name: Show DEB dependencies
        run: |
          set -eu
          # Echo the Depends field so the Qt floor is visible in the log.
          for deb in dist/*.deb; do
            echo "== ${deb}"
            dpkg-deb -f "${deb}" Depends
          done

      - name: Verify packaged binaries
        run: |
          set -eu
          # The step above checks build/QTiSSH, before packaging. Both formats
          # set their dependencies by hand (AUTOREQ/AUTOPROV are off), so
          # nothing ties the declared Qt floor to the binary that actually
          # ended up in the package. That is exactly how a package ends up
          # declaring qt6-qtbase >= 6.4 while shipping a binary that needs
          # Qt_6.7, which installs cleanly and then dies at startup. Re-check
          # the extracted artifact against its own metadata.
          built=$(pkg-config --modversion Qt6Core)
          built_minor=$(printf '%s' "$built" | cut -d. -f2)
          fail=0

          check_binary() { # $1 = binary path, $2 = declared qt floor ("" = none)
            req=$(objdump -p "$1" \
              | sed -n '/Version References/,/^$/p' \
              | grep -oE 'Qt_6\.[0-9]+' | sort -V -u | tail -1 || true)
            [ -n "$req" ] || { echo "   no Qt symbol version found"; return 0; }
            req_minor=${req#Qt_6.}
            echo "   binary requires ${req}; declared floor: ${2:-<none>}"
            if [ -n "$2" ] && [ "$req_minor" -gt "$2" ]; then
              echo "   ::error::binary needs ${req} but the package only declares >= 6.$2"
              return 1
            fi
            return 0
          }

          for rpm in dist/*.rpm; do
            echo "== ${rpm}"
            floor=$(rpm -qp --requires "${rpm}" 2>/dev/null \
              | grep -oE 'qt6-qtbase[^,]*>=[ ]*[0-9]+\.[0-9]+' \
              | grep -oE '[0-9]+\.[0-9]+$' | cut -d. -f2 | sort -V | tail -1)
            rpm -qp --requires "${rpm}" 2>/dev/null | grep -E 'qt6' || true
            tmp=$(mktemp -d)
            (cd "${tmp}" && rpm2cpio "${GITHUB_WORKSPACE}/${rpm}" | cpio -idm --quiet)
            check_binary "${tmp}/usr/bin/QTiSSH" "${floor}" || fail=1
            rm -rf "${tmp}"
          done

          for deb in dist/*.deb; do
            echo "== ${deb}"
            floor=$(dpkg-deb -f "${deb}" Depends | grep -oE 'libqt6core6[^,]*>=[ ]*[0-9]+\.[0-9]+' \
              | grep -oE '[0-9]+\.[0-9]+$' | cut -d. -f2 | sort -V | tail -1)
            tmp=$(mktemp -d)
            dpkg-deb -x "${deb}" "${tmp}"
            check_binary "${tmp}/usr/bin/QTiSSH" "${floor}" || fail=1
            rm -rf "${tmp}"
          done

          echo "Built against Qt ${built} (6.${built_minor})"
          [ "${fail}" -eq 0 ] || { echo "::error::packaged binary is inconsistent with its declared Qt floor"; exit 1; }
          echo "Packaged binaries are consistent with their declared dependencies."

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qtissh-packages
          path: |
            dist/*.deb
            dist/*.rpm

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
