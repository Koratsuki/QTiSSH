name: Package (DEB/RPM)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    name: Build DEB and RPM
    runs-on: ubuntu-latest
    env:
      QT_VERSION: 6.7.2
      QT_MODULES: qtcharts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libx11-dev ninja-build rpm

      - name: Configure
        run: |
          cmake -S src -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        run: cmake --build build

      - name: Package DEB
        run: cpack --config build/CPackConfig.cmake -G DEB -B dist

      - name: Package RPM
        run: cpack --config build/CPackConfig.cmake -G RPM -B dist

      - name: Show packages
        run: ls -lh dist/

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qtissh-packages
          path: |
            dist/*.deb
            dist/*.rpm

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
